name: OCI ARM Auto Claim

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: oci-arm-auto-claim
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

env:
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  IMAGE_ID: ${{ secrets.IMAGE_ID }}
  SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
  AD_NAME: ${{ secrets.AD_NAME }}

  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:

      # ==========================================================
      # 1. Install OCI CLI
      # ==========================================================
      - name: Install OCI CLI
        run: |
          set -e

          python -m pip install --upgrade oci-cli

          echo "OCI CLI:"
          oci --version


      # ==========================================================
      # 2. Configure OCI CLI
      # ==========================================================
      - name: Configure OCI CLI
        run: |
          set -e

          mkdir -p ~/.oci

          printf '%s\n' "${OCI_CLI_KEY_CONTENT}" \
            > ~/.oci/oci_api_key.pem

          chmod 600 ~/.oci/oci_api_key.pem

          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${OCI_CLI_USER}
          tenancy=${OCI_CLI_TENANCY}
          fingerprint=${OCI_CLI_FINGERPRINT}
          key_file=~/.oci/oci_api_key.pem
          region=${OCI_CLI_REGION}
          EOF

          printf '%s\n' "${{ secrets.SSH_PUBLIC_KEY }}" \
            > /home/runner/my_ssh_key.pub


      # ==========================================================
      # 3. Try to create the VM
      # ==========================================================
      - name: Try to Create ARM VM
        id: create_vm
        continue-on-error: true

        run: |
          set +e

          LOG_FILE="/tmp/oci-result.log"
          : > "$LOG_FILE"

          echo "========================================" | tee -a "$LOG_FILE"
          echo "OCI ARM AUTO CLAIM ATTEMPT" | tee -a "$LOG_FILE"
          echo "========================================" | tee -a "$LOG_FILE"

          echo "Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" | tee -a "$LOG_FILE"
          echo "Region: ${OCI_CLI_REGION}" | tee -a "$LOG_FILE"
          echo "AD: ${AD_NAME}" | tee -a "$LOG_FILE"
          echo "Shape: VM.Standard.A1.Flex" | tee -a "$LOG_FILE"
          echo "OCPU: 2" | tee -a "$LOG_FILE"
          echo "RAM: 12 GB" | tee -a "$LOG_FILE"
          echo "Boot Volume: 200 GB" | tee -a "$LOG_FILE"

          echo "" | tee -a "$LOG_FILE"
          echo "Launching VM..." | tee -a "$LOG_FILE"

          OCI_OUTPUT=$(oci compute instance launch \
            --compartment-id "${COMPARTMENT_ID}" \
            --availability-domain "${AD_NAME}" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":2,"memoryInGBs":12}' \
            --subnet-id "${SUBNET_ID}" \
            --image-id "${IMAGE_ID}" \
            --ssh-authorized-keys-file "/home/runner/my_ssh_key.pub" \
            --assign-public-ip true \
            --display-name "arm-free-vm" \
            --boot-volume-size-in-gbs 200 \
            --output json \
            2>&1)

          OCI_RC=$?

          echo "" | tee -a "$LOG_FILE"
          echo "${OCI_OUTPUT}" | tee -a "$LOG_FILE"
          echo "" | tee -a "$LOG_FILE"
          echo "OCI exit code: ${OCI_RC}" | tee -a "$LOG_FILE"

          # ------------------------------------------------------
          # SUCCESS
          # ------------------------------------------------------
          if [ "${OCI_RC}" -eq 0 ]; then

            INSTANCE_ID=$(python - <<'PY' <<< "${OCI_OUTPUT}"
          import json
          import sys

          try:
              data = json.loads(sys.stdin.read()).get("data", {})
              print(data.get("id", ""))
          except Exception:
              print("")
          PY
            )

            echo "" | tee -a "$LOG_FILE"
            echo "✅ VM CREATION REQUEST ACCEPTED" | tee -a "$LOG_FILE"
            echo "Instance ID: ${INSTANCE_ID}" | tee -a "$LOG_FILE"

            echo "result=success" >> "${GITHUB_OUTPUT}"
            echo "instance_id=${INSTANCE_ID}" >> "${GITHUB_OUTPUT}"

            exit 0
          fi


          # ------------------------------------------------------
          # OUT OF CAPACITY
          # ------------------------------------------------------
          if echo "${OCI_OUTPUT}" | grep -qi "Out of host capacity"; then

            echo "" | tee -a "$LOG_FILE"
            echo "⏳ OUT OF HOST CAPACITY" | tee -a "$LOG_FILE"
            echo "Next scheduled attempt will try again." | tee -a "$LOG_FILE"

            echo "result=capacity" >> "${GITHUB_OUTPUT}"

            exit 0
          fi


          # ------------------------------------------------------
          # OTHER ERROR
          # ------------------------------------------------------
          echo "" | tee -a "$LOG_FILE"
          echo "❌ OCI ERROR" | tee -a "$LOG_FILE"

          echo "result=error" >> "${GITHUB_OUTPUT}"

          exit 1


      # ==========================================================
      # 4. Discord notification
      # ==========================================================
      - name: Send Discord Notification
        if: always()
        continue-on-error: true

        uses: sarisia/actions-status-discord@v1.15.4

        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}

          title: >-
            OCI ARM:
            ${{ steps.create_vm.outputs.result || 'error' }}

          status: >-
            ${{ steps.create_vm.outputs.result == 'success'
              && 'success'
              || steps.create_vm.outputs.result == 'capacity'
              && 'neutral'
              || 'failure' }}

          color: >-
            ${{ steps.create_vm.outputs.result == 'success'
              && '0x28a745'
              || steps.create_vm.outputs.result == 'capacity'
              && '0xffc107'
              || '0xdc3545' }}

          description: |
            OCI ARM Auto Claim

            Region:
            ${{ secrets.OCI_CLI_REGION }}

            Configuration:
            2 OCPU / 12 GB RAM / 200 GB Boot

            Result:
            ${{ steps.create_vm.outputs.result }}

            Instance ID:
            ${{ steps.create_vm.outputs.instance_id }}


      # ==========================================================
      # 5. Disable workflow automatically after successful claim
      # ==========================================================
      - name: Disable Workflow After Success
        if: steps.create_vm.outputs.result == 'success'

        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          echo "VM was created successfully."
          echo "Disabling this workflow..."

          gh workflow disable \
            "${{ github.workflow }}" \
            --repo "${{ github.repository }}"

          echo "✅ Workflow disabled."
