name: OCI ARM Auto Claim

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: oci-arm-auto-claim
  cancel-in-progress: false

env:
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  IMAGE_ID: ${{ secrets.IMAGE_ID }}
  SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
  AD_NAME: ${{ secrets.AD_NAME }}

  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      # ==========================================================
      # 1. Install OCI CLI
      # ==========================================================
      - name: Install OCI CLI
        run: |
          set -e

          python -m pip install --upgrade oci-cli

          echo "OCI CLI version:"
          oci --version


      # ==========================================================
      # 2. Configure OCI CLI
      # ==========================================================
      - name: Configure OCI CLI
        run: |
          set -e

          mkdir -p ~/.oci

          printf '%s\n' "${OCI_CLI_KEY_CONTENT}" \
            > ~/.oci/oci_api_key.pem

          chmod 600 ~/.oci/oci_api_key.pem

          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${OCI_CLI_USER}
          tenancy=${OCI_CLI_TENANCY}
          fingerprint=${OCI_CLI_FINGERPRINT}
          key_file=~/.oci/oci_api_key.pem
          region=${OCI_CLI_REGION}
          EOF

          printf '%s\n' "${{ secrets.SSH_PUBLIC_KEY }}" \
            > /home/runner/my_ssh_key.pub


      # ==========================================================
      # 3. Check that OCI credentials/resources still work
      # ==========================================================
      - name: Validate OCI Configuration
        run: |
          set -e

          echo "========================================"
          echo "OCI CONFIGURATION CHECK"
          echo "========================================"

          echo "Region: ${OCI_CLI_REGION}"
          echo "AD: ${AD_NAME}"
          echo "Shape: VM.Standard.A1.Flex"
          echo "OCPU: 2"
          echo "RAM: 12 GB"
          echo "Boot Volume: 200 GB"
          echo ""

          echo "Checking authentication..."

          oci iam user get \
            --user-id "${OCI_CLI_USER}" \
            --output json > /dev/null

          echo "✅ Authentication OK"

          echo "Checking compartment..."

          oci iam compartment get \
            --compartment-id "${COMPARTMENT_ID}" \
            --output json > /dev/null

          echo "✅ Compartment OK"

          echo "Checking image..."

          oci compute image get \
            --image-id "${IMAGE_ID}" \
            --output json > /dev/null

          echo "✅ Image OK"

          echo "Checking subnet..."

          oci network subnet get \
            --subnet-id "${SUBNET_ID}" \
            --output json > /dev/null

          echo "✅ Subnet OK"

          echo ""
          echo "✅ All OCI configuration checks passed."


      # ==========================================================
      # 4. Check whether a VM already exists
      # ==========================================================
      - name: Check Existing VM
        id: existing
        run: |
          set -e

          echo "Checking for existing arm-free-vm..."

          INSTANCE_LIST=$(oci compute instance list \
            --compartment-id "${COMPARTMENT_ID}" \
            --all \
            --output json)

          INSTANCE_ID=$(printf '%s' "${INSTANCE_LIST}" | python -c '
          import json
          import sys

          data = json.load(sys.stdin)

          for item in data.get("data", []):
              if item.get("display-name") == "arm-free-vm":
                  state = item.get("lifecycle-state", "")
                  if state not in ("TERMINATED", "TERMINATING"):
                      print(item.get("id", ""))
                      break
          ')

          if [ -n "${INSTANCE_ID}" ]; then
            echo "✅ Existing VM found:"
            echo "${INSTANCE_ID}"

            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "instance_id=${INSTANCE_ID}" >> "${GITHUB_OUTPUT}"
          else
            echo "No existing VM found."

            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi


      # ==========================================================
      # 5. Finish if a VM already exists
      # ==========================================================
      - name: Finish Existing VM
        if: steps.existing.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          echo "========================================"
          echo "✅ VM ALREADY EXISTS"
          echo "========================================"

          echo "Instance ID:"
          echo "${{ steps.existing.outputs.instance_id }}"

          echo ""
          echo "No new VM will be created."

          gh workflow disable \
            "create-vm.yml" \
            --repo "${{ github.repository }}" || true


      # ==========================================================
      # 6. Try to create the VM
      # ==========================================================
      - name: Try to Create ARM VM
        id: create_vm
        if: steps.existing.outputs.exists != 'true'
        run: |
          set +e

          echo "========================================"
          echo "OCI ARM AUTO CLAIM ATTEMPT"
          echo "========================================"

          echo "Time:"
          date -u '+%Y-%m-%d %H:%M:%S UTC'

          echo ""
          echo "Region: ${OCI_CLI_REGION}"
          echo "AD: ${AD_NAME}"
          echo "Shape: VM.Standard.A1.Flex"
          echo "OCPU: 2"
          echo "RAM: 12 GB"
          echo "Boot Volume: 200 GB"

          echo ""
          echo "Launching VM..."

          OCI_OUTPUT=$(oci compute instance launch \
            --compartment-id "${COMPARTMENT_ID}" \
            --availability-domain "${AD_NAME}" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":2,"memoryInGBs":12}' \
            --subnet-id "${SUBNET_ID}" \
            --image-id "${IMAGE_ID}" \
            --ssh-authorized-keys-file "/home/runner/my_ssh_key.pub" \
            --assign-public-ip true \
            --display-name "arm-free-vm" \
            --boot-volume-size-in-gbs 200 \
            --output json \
            2>&1)

          OCI_RC=$?

          echo ""
          echo "OCI exit code: ${OCI_RC}"
          echo ""

          echo "${OCI_OUTPUT}"

          # -------------------------------------------------------
          # SUCCESS
          # -------------------------------------------------------
          if [ "${OCI_RC}" -eq 0 ]; then

            INSTANCE_ID=$(printf '%s' "${OCI_OUTPUT}" | python -c '
          import json
          import sys

          try:
              data = json.load(sys.stdin)
              print(data.get("data", {}).get("id", ""))
          except Exception:
              print("")
          ')

            if [ -n "${INSTANCE_ID}" ]; then

              echo "result=success" >> "${GITHUB_OUTPUT}"
              echo "instance_id=${INSTANCE_ID}" >> "${GITHUB_OUTPUT}"

              echo ""
              echo "========================================"
              echo "✅ VM CREATION SUCCESSFUL"
              echo "========================================"
              echo "Instance ID:"
              echo "${INSTANCE_ID}"

              exit 0
            fi
          fi


          # -------------------------------------------------------
          # OUT OF HOST CAPACITY
          # -------------------------------------------------------
          if echo "${OCI_OUTPUT}" | grep -qi "Out of host capacity"; then

            echo "result=capacity" >> "${GITHUB_OUTPUT}"

            echo ""
            echo "========================================"
            echo "⏳ OUT OF HOST CAPACITY"
            echo "========================================"

            exit 0
          fi


          # -------------------------------------------------------
          # OTHER ERROR
          # -------------------------------------------------------
          echo "result=error" >> "${GITHUB_OUTPUT}"

          echo ""
          echo "========================================"
          echo "❌ NON-CAPACITY OCI ERROR"
          echo "========================================"

          exit 1


      # ==========================================================
      # 7. Discord notification
      # ==========================================================
      - name: Discord Notification
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RESULT: ${{ steps.create_vm.outputs.result }}
          INSTANCE_ID: ${{ steps.create_vm.outputs.instance_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set +e

          if [ "${RESULT}" = "success" ]; then

            MESSAGE="✅ **OCI ARM VM CREATED!**

          Region: \`${OCI_CLI_REGION}\`
          Shape: \`VM.Standard.A1.Flex\`
          CPU: \`2 OCPU\`
          RAM: \`12 GB\`
          Boot Volume: \`200 GB\`

          Instance ID:
          \`${INSTANCE_ID}\`"

          elif [ "${RESULT}" = "capacity" ]; then

            MESSAGE="⏳ **OCI ARM attempt #${RUN_NUMBER}**

          Out of host capacity.

          Region: \`${OCI_CLI_REGION}\`
          Target: \`2 OCPU / 12 GB / 200 GB\`

          Next attempt will start automatically in about 5 minutes."

          else

            MESSAGE="❌ **OCI ARM claim failed**

          A non-capacity OCI error occurred.

          Check the GitHub Actions log for details."

          fi

          python - "${MESSAGE}" <<'PY' > /tmp/discord.json
          import json
          import sys

          print(json.dumps({
              "content": sys.argv[1]
          }))
          PY

          curl -sS \
            -H "Content-Type: application/json" \
            -X POST \
            --data-binary @/tmp/discord.json \
            "${WEBHOOK}" \
            >/dev/null 2>&1 || true


      # ==========================================================
      # 8. Success -> stop the chain
      # ==========================================================
      - name: Stop After Success
        if: steps.create_vm.outputs.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          echo "========================================"
          echo "✅ CLAIM COMPLETE"
          echo "========================================"

          echo "Instance ID:"
          echo "${{ steps.create_vm.outputs.instance_id }}"

          echo ""
          echo "Disabling workflow so no more attempts are made."

          gh workflow disable \
            "create-vm.yml" \
            --repo "${{ github.repository }}"

          echo "✅ Workflow disabled."


      # ==========================================================
      # 9. Capacity -> wait 5 min -> start another workflow run
      # ==========================================================
      - name: Retry After Capacity
        if: steps.create_vm.outputs.result == 'capacity'
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -e

          echo "========================================"
          echo "⏳ CAPACITY RETRY"
          echo "========================================"

          echo "Waiting 5 minutes..."
          sleep 300

          echo ""
          echo "Starting the next workflow run..."

          gh workflow run \
            "create-vm.yml" \
            --repo "${{ github.repository }}" \
            --ref main

          echo ""
          echo "✅ Next attempt dispatched."
